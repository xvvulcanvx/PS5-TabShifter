name: Build PS5 TabShifter Payload

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PS5 Payload SDK & SQLite Amalgamation
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wget unzip make
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q ps5-payload-sdk.zip -d /opt
          wget -q https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip
          unzip -q -j sqlite-amalgamation-3460100.zip "*/sqlite3.c" "*/sqlite3.h"

      - name: Compile TabShifter.elf
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          /opt/ps5-payload-sdk/bin/prospero-clang -O2 -I. \
            -DSQLITE_THREADSAFE=0 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -DSQLITE_OMIT_WAL=1 \
            main.c sqlite3.c -lkernel_sys -o TabShifter.elf

      - name: Upload Compiled TabShifter.elf
        uses: actions/upload-artifact@v4
        with:
          name: TabShifter-PS5-13.60
          path: TabShifter.elf
